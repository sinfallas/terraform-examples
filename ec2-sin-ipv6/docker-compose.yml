services:
  terraform:
    image: sinfallas/terraform-all-in-one:latest
    hostname: terraform
    container_name: terraform
    pull_policy: always
    restart: always
    ports:
      - 3000:3000
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
      - TF_VAR_aws_region=${AWS_DEFAULT_REGION}
      - TF_VAR_aws_vpc=${TF_VAR_aws_vpc}
      - TF_VAR_aws_subnet=${TF_VAR_aws_subnet}
      - TF_VAR_rnombre=${TF_VAR_rnombre}
      - TF_VAR_url=${TF_VAR_url}
      - TF_VAR_rtag=${TF_VAR_rtag}
      - TF_VAR_rtoken=${TF_VAR_rtoken}
      - TF_VAR_ubuntupass=${TF_VAR_ubuntupass}
      - TF_VAR_gitlabpass=${TF_VAR_gitlabpass}
      - TF_VAR_nombreinstancia=${TF_VAR_nombreinstancia}
      - TF_VAR_nombregruposeguridad=${TF_VAR_nombregruposeguridad}
      - TF_VAR_instancetype=${TF_VAR_instancetype}
      - TF_VAR_pemname=${TF_VAR_pemname}
      - TF_VAR_diskspace=${TF_VAR_diskspace}
    volumes:
#      - ./config.json:/etc/semaphore/config.json
#      - ./semaphore_data:/app
      - ./recursos:/recursos
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
