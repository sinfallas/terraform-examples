<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S3 + CloudFront Test</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 2rem;
            max-width: 460px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(34, 197, 94, 0.12);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.25);
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
        }
        .dot {
            width: 8px;
            height: 8px;
            background-color: #4ade80;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #4ade80;
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; font-weight: 700; color: #ffffff; }
        p { color: #94a3b8; font-size: 0.925rem; line-height: 1.5; margin-bottom: 1.5rem; }
        .info-box {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 0.875rem 1rem;
            text-align: left;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.825rem;
            color: #cbd5e1;
            margin-bottom: 1.25rem;
        }
        .info-row { display: flex; justify-content: space-between; margin-bottom: 0.4rem; }
        .info-row:last-child { margin-bottom: 0; }
        .label { color: #64748b; }
        footer { font-size: 0.75rem; color: #64748b; }
    </style>
</head>
<body>
    <div class="card">
        <div class="status-badge">
            <span class="dot"></span> AWS CloudFront + S3 Online
        </div>
        <h1>¡Conexión Exitosa!</h1>
        <p>Tu sitio web estático alojado en Amazon S3 y distribuido mediante CDN CloudFront está funcionando correctamente.</p>
        
        <div class="info-box">
            <div class="info-row"><span class="label">Estado HTTP:</span> <span style="color:#4ade80;">200 OK</span></div>
            <div class="info-row"><span class="label">Protocolo:</span> <span id="proto">HTTP/2</span></div>
            <div class="info-row"><span class="label">Carga Local:</span> <span id="time">--:--:--</span></div>
        </div>

        <footer>Prueba de distribución global S3 + CloudFront</footer>
    </div>

    <script>
        document.getElementById('proto').textContent = window.location.protocol.toUpperCase().replace(':', '');
        document.getElementById('time').textContent = new Date().toLocaleTimeString();
    </script>
</body>
</html>
